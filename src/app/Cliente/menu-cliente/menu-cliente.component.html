<section class="hero-section position-relative d-flex align-items-center" style="background-image: url('/assets/banner.png'); background-size: cover; background-position: center; height: 500px;">
  <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50 z-0"></div>
  
  <div class="container position-relative z-1 text-white py-5">
    <div class="row">
      <div class="col-12 col-md-8 col-lg-6">
        <h1 class="display-3 fw-bold font-serif mb-3">Endulza tus momentos especiales</h1>
        <p class="lead mb-4">Tortas, cupcakes y postres artesanales hechos con amor y los mejores ingredientes.</p>
        <button type="button" class="btn btn-primary btn-lg rounded-pill px-4 fw-semibold shadow-sm" 
        (click)="scrollToProductos()">
          Ver Productos
        </button>
      </div>
    </div>
  </div>
</section>

<section id="productos" class="py-5 bg-light">
  <div class="container py-4">
    
    <div class="text-center mb-5">
      <h2 class="display-5 font-serif text-dark mb-2">Nuestros Productos</h2>
      <p class="text-muted fs-5">Explora nuestro catálogo completo</p>
    </div>

    <div class="d-flex justify-content-center flex-wrap gap-2 mb-5" role="group" aria-label="Filtros de categorías">
      <button 
        type="button"
        *ngFor="let cat of categorias" 
        class="btn rounded-pill px-4 fw-medium transition-colors"
        [ngClass]="categoriaActiva === cat ? 'btn-primary shadow-sm text-white' : 'btn-white text-dark border'"
        (click)="seleccionarCategoria(cat)">
        {{ cat }}
      </button>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
      <div class="col" *ngFor="let producto of productosFiltrados">
        <article class="card h-100 border-0 shadow-sm product-card transition-transform">
          <div class="ratio ratio-4x3 overflow-hidden bg-white rounded-top">
            <img [src]="producto.imagenUrl" [alt]="'Fotografía de ' + producto.nombre" class="card-img-top object-fit-cover">
          </div>
          <div class="card-body d-flex flex-column text-center p-4">
            <h3 class="card-title h5 text-dark fw-semibold mb-1">{{ producto.nombre }}</h3>
            <p class="card-text text-primary fs-4 fw-bold mb-4">{{ producto.precio | currency:'PEN':'symbol':'1.2-2' }}</p>
            
            <button type="button" class="btn btn-outline-primary mt-auto w-100 rounded-pill fw-medium" [routerLink]="['/producto', producto.id]">
              Ver Detalle
            </button>
          </div>
        </article>
      </div>
    </div>

  </div>
</section>
