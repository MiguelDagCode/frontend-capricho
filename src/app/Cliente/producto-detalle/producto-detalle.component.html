<div class="container py-5">
  
  <a routerLink="/" class="text-decoration-none text-muted d-inline-flex align-items-center mb-4 transition-colors nav-back-link">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2" viewBox="0 0 24 24">
      <path d="M19 12H5M12 19l-7-7 7-7"></path>
    </svg>
    Volver
  </a>

  <div class="row g-5" *ngIf="producto">
    
    <div class="col-12 col-lg-6">
      <div class="bg-white rounded-4 shadow-sm overflow-hidden ratio ratio-1x1 sticky-lg-top product-image-wrapper">
        <img [src]="producto.imagenUrl" [alt]="'Fotografía de ' + producto.nombre" class="object-fit-cover w-100 h-100">
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <span class="badge rounded-pill bg-brand-primary text-white px-3 py-2 mb-3 fw-medium">{{ producto.categoria }}</span>
      <h1 class="display-5 font-serif fw-bold text-dark mb-3">{{ producto.nombre }}</h1>
      
      <p class="text-muted fs-5 mb-4 lh-base">{{ producto.descripcion }}</p>
      <p class="fs-2 text-brand-primary fw-bold mb-4">{{ producto.precio | currency:'PEN':'symbol':'1.2-2' }}</p>

      <form class="product-form mt-4">
        <div class="mb-4">
          <label class="form-label fw-semibold text-dark mb-3">Tamaño</label>
          <div class="d-flex flex-wrap gap-2" role="group" aria-label="Selector de tamaño">
            <input type="radio" class="btn-check" name="tamano" id="tamano_personal" checked>
            <label class="btn btn-choice rounded-pill px-4 py-2" for="tamano_personal">Personal (15cm)</label>

            <input type="radio" class="btn-check" name="tamano" id="tamano_mediana">
            <label class="btn btn-choice rounded-pill px-4 py-2" for="tamano_mediana">Mediana (20cm)</label>

            <input type="radio" class="btn-check" name="tamano" id="tamano_grande">
            <label class="btn btn-choice rounded-pill px-4 py-2" for="tamano_grande">Grande (25cm)</label>
          </div>
        </div>

        <div class="d-flex flex-column flex-sm-row gap-4 align-items-sm-center mt-4 pt-3 border-top border-light">
          
          <div class="d-flex align-items-center">
            <span class="fw-semibold text-dark me-3">Cantidad</span>
            <div class="input-group quantity-selector rounded-pill bg-light border p-1 d-flex align-items-center">
              <button (click)="disminuirCantidad()" class="btn btn-link text-dark text-decoration-none px-3" type="button" aria-label="Disminuir cantidad">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M5 12h14"></path></svg>
              </button>
              
              <input type="text" [value]="cantidad" class="form-control border-0 bg-transparent text-center fw-bold px-0 shadow-none text-dark w-40px" readonly aria-label="Cantidad">
              
              <button (click)="aumentarCantidad()" class="btn btn-link text-dark text-decoration-none px-3" type="button" aria-label="Aumentar cantidad">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
          </div>

          <button type="button" class="btn btn-brand-primary btn-lg rounded-pill px-5 fw-semibold shadow-sm flex-grow-1 d-flex justify-content-center align-items-center gap-2 transition-transform hover-lift">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            Agregar al Carrito
          </button>
          
        </div>
      </form>
    </div>
  </div>

  <div class="text-center py-5" *ngIf="!producto">
    <h2 class="text-muted">Producto no encontrado</h2>
    <a routerLink="/" class="btn btn-outline-secondary mt-3 rounded-pill px-4">Volver al catálogo</a>
  </div>
</div>
