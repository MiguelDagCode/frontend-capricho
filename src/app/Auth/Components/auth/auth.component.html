<div class="container py-5 d-flex justify-content-center align-items-center min-vh-75">
  
  <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
    
    <a routerLink="/" class="text-decoration-none text-muted d-inline-flex align-items-center mb-4 transition-colors nav-back-link" style="cursor: pointer;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2" viewBox="0 0 24 24">
        <path d="M19 12H5M12 19l-7-7 7-7"></path>
      </svg>
      Volver
    </a>

    <div class="card border-0 shadow-sm rounded-4 auth-card">
      <div class="card-body p-4 p-md-5 text-center">
        
        <div class="mb-3" style="color: #d14d68;">
          <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"></path>
            <path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"></path>
            <path d="M2 21h20"></path>
            <path d="M7 8v3"></path>
            <path d="M12 8v3"></path>
            <path d="M17 8v3"></path>
            <path d="M7 4h.01"></path>
            <path d="M12 4h.01"></path>
            <path d="M17 4h.01"></path>
          </svg>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger rounded-3 p-2 small" role="alert">
          {{ errorMessage }}
        </div>

        <ng-container *ngIf="isLoginMode">
          <h2 class="h3 font-serif fw-bold text-dark mb-2">Iniciar Sesión</h2>
          <p class="text-muted small mb-4">Ingresa para completar tu compra</p>

          <form class="text-start" [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
            <div class="mb-3">
              <label for="loginEmail" class="form-label fw-semibold text-dark small">Correo electrónico</label>
              <input type="email" class="form-control form-control-lg rounded-3 fs-6 custom-input" id="loginEmail" placeholder="correo@ejemplo.com" formControlName="email"
                     [ngClass]="{'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}">
            </div>
            
            <div class="mb-4">
              <label for="loginPassword" class="form-label fw-semibold text-dark small">Contraseña</label>
              <input type="password" class="form-control form-control-lg rounded-3 fs-6 custom-input" id="loginPassword" placeholder="••••••••" formControlName="password"
                     [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}">
            </div>

            <button type="submit" class="btn btn-brand-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm transition-transform hover-lift mb-4 text-white" 
                    style="background-color: #d14d68; border: none;" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ isLoading ? 'Validando...' : 'Iniciar Sesión' }}
            </button>
          </form>

          <p class="text-muted small mb-0">
            ¿No tienes cuenta? 
            <a (click)="switchMode()" class="text-decoration-none fw-semibold transition-colors auth-toggle-link" style="color: #d14d68; cursor: pointer;">Regístrate</a>
          </p>
        </ng-container>


        <ng-container *ngIf="!isLoginMode">
          <h2 class="h3 font-serif fw-bold text-dark mb-2">Crear Cuenta</h2>
          <p class="text-muted small mb-4">Regístrate para empezar a comprar</p>

          <form class="text-start" [formGroup]="registerForm" (ngSubmit)="onSubmitRegister()">
            <div class="mb-3">
              <label for="registerName" class="form-label fw-semibold text-dark small">Nombre completo</label>
              <input type="text" class="form-control form-control-lg rounded-3 fs-6 custom-input" id="registerName" placeholder="Tu nombre" formControlName="nombre"
                     [ngClass]="{'is-invalid': registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched}">
            </div>

            <div class="mb-3">
              <label for="registerEmail" class="form-label fw-semibold text-dark small">Correo electrónico</label>
              <input type="email" class="form-control form-control-lg rounded-3 fs-6 custom-input" id="registerEmail" placeholder="correo@ejemplo.com" formControlName="email"
                     [ngClass]="{'is-invalid': registerForm.get('email')?.invalid && registerForm.get('email')?.touched}">
            </div>
            
            <div class="mb-4">
              <label for="registerPassword" class="form-label fw-semibold text-dark small">Contraseña</label>
              <input type="password" class="form-control form-control-lg rounded-3 fs-6 custom-input" id="registerPassword" placeholder="••••••••" formControlName="password"
                     [ngClass]="{'is-invalid': registerForm.get('password')?.invalid && registerForm.get('password')?.touched}">
            </div>

            <button type="submit" class="btn btn-brand-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm transition-transform hover-lift mb-4 text-white" 
                    style="background-color: #d14d68; border: none;" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ isLoading ? 'Procesando...' : 'Registrarme' }}
            </button>
          </form>

          <p class="text-muted small mb-0">
            ¿Ya tienes cuenta? 
            <a (click)="switchMode()" class="text-decoration-none fw-semibold transition-colors auth-toggle-link" style="color: #d14d68; cursor: pointer;">Inicia Sesión</a>
          </p>
        </ng-container>

      </div>
    </div>

  </div>
</div>
